name: Deploy Static Assets to S3

on:
  push:
    branches: [main]
    paths: ['src/static/**']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync src/static/ s3://${{ secrets.S3_BUCKET_NAME }}/static/ --delete

      - name: Print summary
        run: aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/static/ --recursive
      - name: Invalidate CloudFront cache
        run: |
          DOMAIN=$(cd infra && terraform output -raw domain_name 2>/dev/null || echo "app.scoutcloud.dev")
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?contains(@,\'$DOMAIN\')]].Id" \
            --output text)
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
            echo "Cache invalidated for: $DISTRIBUTION_ID"
          fi
