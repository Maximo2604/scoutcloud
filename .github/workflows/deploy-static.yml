# Updated: graceful bucket check
name: Deploy Static Assets to S3

on:
  push:
    branches: [main]
    paths: ['src/static/**']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          if aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }} 2>/dev/null; then
            aws s3 sync src/static/ s3://${{ secrets.S3_BUCKET_NAME }}/static/ --delete
          else
            echo "S3 bucket not found - infrastructure may be destroyed. Skipping sync."
          fi

      - name: Print summary
        run: aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/static/ --recursive 2>/dev/null || echo "Bucket not available"

      - name: Deployment Receipt
        run: |
          if ! aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }} 2>/dev/null; then
            echo "## Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Infrastructure not deployed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          FILE_COUNT=$(aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/static/ --recursive | wc -l | tr -d ' ')
          TOTAL_SIZE=$(aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/static/ --recursive --human-readable | awk '{print $3, $4}' | tail -1)
          BUCKET=${{ secrets.S3_BUCKET_NAME }}

          echo "## 🚀 Deployment Receipt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Timestamp | \`$TIMESTAMP\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 Files Synced | \`$FILE_COUNT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 💾 Total Size | \`$TOTAL_SIZE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪣 S3 Bucket | \`$BUCKET\` |" >> $GITHUB_STEP_SUMMARY
