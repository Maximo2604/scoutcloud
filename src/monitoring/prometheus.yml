global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'scoutcloud-app'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'

rule_files:
  - "alerts.yml"
